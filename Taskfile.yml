version: '3'

# CI runs these same commands. BASE is the revision to compare against for the
# checks that only look at what changed (new vulnerable dependencies, contracts).

vars:
  BASE: '{{.BASE | default "origin/main"}}'
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

tasks:
  dev:
    desc: Install the locked development environment
    cmds:
      - uv sync --locked

  test:
    desc: Run the tests, including the Docker sandbox tests
    cmds:
      - uv run --locked pytest

  build:
    desc: Build the package
    cmds:
      - uv build --quiet

  lint:
    desc: Lint, format check, type check, and check workflow pins
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
      - uv run --locked mypy
      - uv run --locked python scripts/check_action_pins.py

  secrets:
    desc: Scan the whole git history for secrets (needs Docker)
    cmds:
      - docker run --rm -v "$PWD:/repo:ro" {{.GITLEAKS_IMAGE}} git --redact --no-banner /repo

  deps:
    desc: Fail on vulnerable dependencies added since BASE
    cmds:
      - uv run --locked python scripts/check_new_vulns.py {{.BASE}}

  contracts:
    desc: Breaking-change check on contract and schema paths changed since BASE
    cmds:
      - uv run --locked python scripts/check_contracts.py {{.BASE}}

  pr-body:
    desc: Check a PR description (in PR_BODY) has Problem and Acceptance check
    cmds:
      - uv run --locked python scripts/check_pr_body.py

  verify:
    desc: Everything the gate runs that doesn't need a pull request
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: secrets
      - task: deps
      - task: contracts
